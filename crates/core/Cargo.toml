[package]
name = "gp-core"
description = "Block 3a — pure, deterministic physics core: geometry (dual grid), track artifact, simulation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
enumflags2 = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_xoshiro = { workspace = true }
strum = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

# Local-only differential benchmark (see the file's own docs for the
# invocation). `harness = false` hands `main` to criterion; `test = false`
# keeps `cargo test --workspace` from running it as a test target. It is
# still compiled and linted by `cargo clippy --workspace --all-targets`,
# which is what stops it bit-rotting.
[[bench]]
name = "supercover"
harness = false
test = false
