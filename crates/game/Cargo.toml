[package]
name = "gp-game"
description = "Block 3b — game loop & orchestration; the runnable graphite-gp binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "graphite-gp"
path = "src/main.rs"

[dependencies]
gp-core = { workspace = true }
gp-gen = { workspace = true }
gp-render = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
eframe = { workspace = true }
rand = { workspace = true }
rand_xoshiro = { workspace = true }
# `winit` is never `use`d in this crate. It exists solely to carry Cargo
# features to the single shared winit package via feature unification:
# `wayland-dlopen` + `wayland-csd-adwaita`, the two members of eframe's
# `"winit/default"` that a dependent cannot express directly (that syntax is
# legal only inside a crate's own `[features]` table). Without this dep,
# Wayland client-side decorations silently fall back to a plainer
# `FallbackFrame` instead of `AdwaitaFrame`, and libwayland is linked instead
# of `dlopen`ed — nothing else in the workspace catches that regression, so
# do not delete this as an "unused dependency" (spec `2026-07-17-render-onest-font-swap`
# AC18 verifies it).
winit = { workspace = true }

[dev-dependencies]
# `strum::VariantArray`/`Action::VARIANTS` (design § *How AC21's record is
# produced*) — `crates/game/tests/replay.rs`'s `FirstLegal` seat needs the
# trait in scope. `gp-core`/`gp-gen`/`gp-render` all pull `strum` in
# transitively already (`cargo tree --invert strum` confirms), but a
# transitive edge does not grant `use strum::VariantArray` from `gp-game`
# itself — this is `gp-game`'s own direct edge for that reachability.
# `strum` is already in `Cargo.lock` at the workspace-pinned version, so
# this is not a new dependency class (no Miri re-check trigger).
strum = { workspace = true }
