name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Turn adjustable rustc lint warnings into hard errors for local crates across
  # the build/test/docs compile lanes (respected as of Rust 1.97; MSRV is 1.97.1).
  # Complements clippy's `-D warnings` and the workspace deny lint tables.
  CARGO_BUILD_WARNINGS: deny

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Any future Rust artefact must be added here in the same PR that
            # introduces it to keep the gate accurate. `clippy.toml` is included
            # so a lint-config-only edit still triggers the Rust jobs.
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - '.github/workflows/**'
              - 'rust-toolchain*'

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  build:
    name: Build (compile)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ${{ runner.os }}-stable-v2
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build
        run: cargo build --workspace --keep-going

  test:
    name: Test (run)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ${{ runner.os }}-stable-v2
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install Vulkan software stack
        run: |
          sudo apt-get update
          # mesa-vulkan-drivers: Vulkan ICD (lavapipe) software rasteriser
          # vulkan-tools: provides vulkaninfo for the diagnostics gate below
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: Vulkan diagnostics
        run: vulkaninfo --summary
      - name: Build tests
        run: cargo build --workspace --tests --keep-going
      - name: Test
        run: cargo test --workspace --tests --no-fail-fast
      - name: Upload golden-image failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gp-render-golden-diffs
          # One pattern per line — @actions/glob sets `nobrace: true`, so a
          # brace-expansion form (`*.{diff,new}.png`) matches nothing and
          # would make this a silent no-op with `if-no-files-found: ignore`.
          path: |
            crates/render/tests/snapshots/**/*.diff.png
            crates/render/tests/snapshots/**/*.new.png
          if-no-files-found: ignore

  clippy:
    name: Clippy (lint)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-shared-key: ${{ runner.os }}-stable-v2
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  docs:
    name: Docs (build)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-shared-key: ${{ runner.os }}-stable-v2
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Docs
        run: cargo doc --no-deps --workspace --keep-going
        env:
          RUSTDOCFLAGS: "-D warnings"

  miri:
    name: Miri / Tree Borrows
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # No `continue-on-error` (#76) — a red Miri must turn the run red, not just
    # the check: it fails this job → the run → the `miri-pass` aggregator below
    # (context `Miri`). That context is deliberately NOT required by
    # `main-protection` while Miri's wall-clock is long (pending #134 for gp-gen
    # plus per-crate tuning), so a red Miri is a regression to fix, not a merge
    # block. Restore `Miri` to the required set once those land.
    env:
      # `-Zmiri-tree-borrows`: aliasing model per design.
      MIRIFLAGS: -Zmiri-tree-borrows
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust nightly with miri + rust-src
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri, rust-src
          cache-shared-key: ${{ runner.os }}-nightly-miri-v1
      - name: cargo miri setup
        run: cargo miri setup
      # `gp-gen` is excluded: its multi-seed generator property sweeps (Ф1/Ф2/Ф3
      # full-pipeline runs over large `k×k` corridors) blow up the Miri interpreter
      # wall-clock (>1h and growing) — see #134 for the re-enable plan (gated seed
      # sweeps). Native `cargo test` + `clippy::arithmetic_side_effects = deny` (#48)
      # still cover gp-gen's integer discipline; only the Miri UB pass is dropped.
      # gp-game is excluded on the same cost/ergonomics grounds — see #184. Since
      # #43 it is the orchestration crate: the generation worker spawns real
      # threads, the persisted replay format does real file I/O, and the CLI
      # contract tests spawn the built binary. Each is gateable per test, but the
      # list would grow with nearly every new test and one missed attribute aborts
      # the whole crate binary (Miri fails fast on the first unsupported op). The
      # workspace has zero production `unsafe`, and the crate that most warrants
      # the UB pass — gp-core — stays in the gate and is green.
      - name: cargo miri test (workspace, gp-gen — #134 — and gp-game — #184 — excluded)
        run: cargo miri test --workspace --exclude gp-gen --exclude gp-game

  build-pass:
    name: Build
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.build.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  test-pass:
    name: Test
    needs: [changes, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.test.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  clippy-pass:
    name: Clippy
    needs: [changes, clippy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.clippy.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  docs-pass:
    name: Docs
    needs: [changes, docs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.docs.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi

  # Aggregator producing the `Miri` context (#76). Mirrors build/test/clippy/
  # docs-pass: an `if: always()` aggregator so a path-filtered `skipped` Miri
  # passes, while a red `miri` job reddens this too. Unlike its siblings, `Miri`
  # is deliberately NOT in `main-protection`'s required set while Miri's
  # wall-clock is long (pending #134) — so a red Miri is a regression to fix,
  # not a merge block. If it is ever restored to the required set, the context
  # to require is this aggregator, not the raw `if:`-filtered `miri` job.
  miri-pass:
    name: Miri
    needs: [changes, miri]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          c="${{ needs.changes.result }}"
          r="${{ needs.miri.result }}"
          if [[ "$c" != "success" ]] || [[ "$r" != "success" && "$r" != "skipped" ]]; then exit 1; fi
