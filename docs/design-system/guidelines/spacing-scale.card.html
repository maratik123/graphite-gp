<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4px lattice — spacing snaps to the cell" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--surface-page);padding:22px;color:var(--text-ink)}
  .row{display:flex;align-items:flex-end;gap:14px}
  .u{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9px;color:var(--text-muted)}
  .bar{background:var(--accent);width:100%}
  .u .b{background:var(--graphite-700)}
</style></head>
<body>
  <div class="row">
    <div class="u" style="width:20px"><div class="bar" style="height:4px"></div>1</div>
    <div class="u" style="width:20px"><div class="bar" style="height:8px"></div>2</div>
    <div class="u" style="width:24px"><div class="bar" style="height:16px"></div>4</div>
    <div class="u" style="width:28px"><div class="bar" style="height:24px"></div>6</div>
    <div class="u" style="width:34px"><div class="bar" style="height:32px"></div>8</div>
    <div class="u" style="width:44px"><div class="bar" style="height:48px"></div>12</div>
    <div class="u" style="width:56px"><div class="bar" style="height:64px"></div>16</div>
    <div class="u" style="width:72px"><div class="bar" style="height:80px"></div>20</div>
  </div>
</body></html>
