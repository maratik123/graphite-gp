<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:var(--surface-page);padding:24px;color:var(--text-body)}
  .eyebrow{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-muted);font-weight:var(--fw-semibold)}
  .title{font-size:var(--fs-title);font-weight:var(--fw-semibold);color:var(--text-ink);margin:6px 0}
  .body{font-size:var(--fs-body);line-height:var(--lh-normal);max-width:52ch}
  .muted{color:var(--text-muted);font-size:var(--fs-sm);margin-top:8px}
</style></head>
<body>
  <div class="eyebrow">Track 04 · Procedural</div>
  <div class="title">A wall never crosses a point.</div>
  <div class="body">The corridor D is a set of drivable cells; walls are the dual edges on its boundary. Legality holds by construction — the car never touches a wall.</div>
  <div class="muted">Body 15px · label 11px uppercase +0.06em · muted 13px</div>
</body></html>
