<!-- @dsCard group="Colors" viewport="700x160" name="GP vermilion accent" subtitle="The single brand accent + interaction states" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--surface-page);padding:20px;color:var(--text-ink)}
  .row{display:flex;gap:12px}
  .sw{flex:1;height:96px;border-radius:var(--radius-2);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:10px;color:var(--paper-0)}
  .sw.d{color:var(--graphite-900)}
  .sw span{opacity:.8}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--accent)">accent<br><span>#E24A2B</span></div>
    <div class="sw" style="background:var(--accent-hover)">hover<br><span>#C93C20</span></div>
    <div class="sw" style="background:var(--accent-press)">press<br><span>#B23319</span></div>
    <div class="sw d" style="background:var(--accent-tint);border:1px solid var(--border-hairline)">tint<br><span>#F7D9CF</span></div>
  </div>
</body></html>
