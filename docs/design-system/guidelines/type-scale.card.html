<!-- @dsCard group="Type" viewport="700x260" name="Type scale" subtitle="Display → micro, Space Grotesk" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-display);background:var(--surface-page);padding:22px;color:var(--text-ink)}
  .r{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .r .t{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);width:64px;flex:none}
</style></head>
<body>
  <div class="r"><span class="t">56 / h0</span><span style="font-size:var(--fs-display);font-weight:700;letter-spacing:-.02em">Display</span></div>
  <div class="r"><span class="t">40 / h1</span><span style="font-size:var(--fs-h1);font-weight:600">Heading 1</span></div>
  <div class="r"><span class="t">30 / h2</span><span style="font-size:var(--fs-h2);font-weight:600">Heading 2</span></div>
  <div class="r"><span class="t">22 / h3</span><span style="font-size:var(--fs-h3);font-weight:500">Heading 3</span></div>
  <div class="r"><span class="t">15 / body</span><span style="font-size:var(--fs-body)">Body text</span></div>
  <div class="r"><span class="t">11 / xs</span><span style="font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em">Eyebrow</span></div>
</body></html>
