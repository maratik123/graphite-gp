<!-- @dsCard group="Colors" viewport="700x150" name="Paper" subtitle="The graph-paper ground — warmest highlight to pressed edge" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--surface-page);padding:20px;color:var(--text-ink)}
  .row{display:flex;gap:0}
  .sw{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:10px}
  .sw span{opacity:.7}
  .b{border:1px solid var(--border-hairline)}
</style></head>
<body>
  <div class="row b">
    <div class="sw" style="background:var(--paper-0)">paper-0<br><span>#FBF8F0</span></div>
    <div class="sw" style="background:var(--paper-1)">paper-1<br><span>#F5F1E6</span></div>
    <div class="sw" style="background:var(--paper-2)">paper-2<br><span>#ECE6D6</span></div>
    <div class="sw" style="background:var(--paper-3)">paper-3<br><span>#E0D9C6</span></div>
  </div>
</body></html>
