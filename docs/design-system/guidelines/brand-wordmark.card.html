<!-- @dsCard group="Brand" viewport="700x220" name="Wordmark" subtitle="No logo in source — set in plain type on the grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-display);background-color:var(--graphite-900);
    background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:var(--cell) var(--cell);
    height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--paper-0)}
  .mark{display:flex;align-items:center;gap:16px}
  .word{font-size:44px;font-weight:var(--fw-bold);letter-spacing:-.02em}
  .word b{color:var(--accent)}
  .dot{width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--paper-0)}
  .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--graphite-300);text-transform:uppercase}
</style></head>
<body>
  <div class="mark"><span class="dot"></span><span class="word">GRAPHITE <b>GP</b></span></div>
  <div class="sub">grid vector racing</div>
</body></html>
