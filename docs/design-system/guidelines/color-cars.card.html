<!-- @dsCard group="Colors" viewport="700x160" name="Car chalk hues" subtitle="Distinct per-car colors; car 1 = the brand accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--surface-page);padding:20px;color:var(--text-ink)}
  .row{display:flex;gap:14px}
  .car{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:10px}
  .dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--graphite-900)}
</style></head>
<body>
  <div class="row">
    <div class="car"><div class="dot" style="background:var(--car-1)"></div>car-1</div>
    <div class="car"><div class="dot" style="background:var(--car-2)"></div>car-2</div>
    <div class="car"><div class="dot" style="background:var(--car-3)"></div>car-3</div>
    <div class="car"><div class="dot" style="background:var(--car-4)"></div>car-4</div>
    <div class="car"><div class="dot" style="background:var(--car-5)"></div>car-5</div>
    <div class="car"><div class="dot" style="background:var(--car-6)"></div>car-6</div>
  </div>
</body></html>
