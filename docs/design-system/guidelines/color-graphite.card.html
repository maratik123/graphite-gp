<!-- @dsCard group="Colors" viewport="700x150" name="Graphite ink ramp" subtitle="Warm near-black pencil through to faint hairline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--surface-page);padding:20px;color:var(--text-ink)}
  .row{display:flex;gap:0;border:1px solid var(--border-hairline)}
  .sw{flex:1;height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:9px}
  .sw span{opacity:.7}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--graphite-900);color:#F5F1E6">900</div>
    <div class="sw" style="background:var(--graphite-800);color:#F5F1E6">800</div>
    <div class="sw" style="background:var(--graphite-700);color:#F5F1E6">700</div>
    <div class="sw" style="background:var(--graphite-600);color:#F5F1E6">600</div>
    <div class="sw" style="background:var(--graphite-500);color:#F5F1E6">500</div>
    <div class="sw" style="background:var(--graphite-400)">400</div>
    <div class="sw" style="background:var(--graphite-300)">300</div>
    <div class="sw" style="background:var(--graphite-200)">200</div>
  </div>
</body></html>
