<!-- @dsCard group="Colors" viewport="700x150" name="Status semantics" subtitle="Valid / caution / crash — with tints" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-mono);background:var(--surface-page);padding:20px;color:var(--text-ink)}
  .row{display:flex;gap:12px}
  .chip{flex:1;border-radius:var(--radius-2);padding:12px;box-sizing:border-box;font-size:11px;border:1px solid var(--border-hairline)}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
</style></head>
<body>
  <div class="row">
    <div class="chip" style="background:var(--ok-tint)"><span class="dot" style="background:var(--ok)"></span>ok · valid track</div>
    <div class="chip" style="background:var(--warn-tint)"><span class="dot" style="background:var(--warn)"></span>warn · run-out</div>
    <div class="chip" style="background:var(--danger-tint)"><span class="dot" style="background:var(--danger)"></span>danger · crash</div>
  </div>
</body></html>
