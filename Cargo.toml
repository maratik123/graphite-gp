# graphite-gp — grid racing game (see docs/design.md)
#
# Workspace layout mirrors the 4-block architecture (design doc §6):
#   crates/core    — block 3a: pure, deterministic physics core (shared dependency)
#   crates/gen     — block 1:  track generation
#   crates/render  — block 2:  rendering + UX
#   crates/ai      — block 4:  AI training
#   crates/game    — block 3b: game loop / orchestration (runnable binary)
#
# Build order (design doc §6): 3a -> (1 || 2) -> 4.

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/gen",
    "crates/render",
    "crates/ai",
    "crates/game",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Marat Bukharov <marat.buharov@gmail.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gp-core = { path = "crates/core" }
gp-gen = { path = "crates/gen" }
gp-render = { path = "crates/render" }
gp-ai = { path = "crates/ai" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
enum-map = "3"
enumflags2 = "0.7"
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.10", default-features = false }
rand_xoshiro = { version = "0.8", default-features = false }
egui = { version = "0.35", default-features = false }
resvg = { version = "0.47", default-features = false }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
eframe = { version = "0.35", default-features = false, features = ["accesskit", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = { version = "0.30", default-features = true }
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }
# Property testing (dev-only). `fork`/`timeout` are dropped — they pull
# rusty-fork + tempfile for out-of-process case isolation this workspace
# does not use; our properties are pure integer functions.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# Benchmarking (dev-only, local-only — CI never runs `cargo bench`). Lean
# feature set: `cargo_bench_support` is what `cargo bench` needs; `rayon`
# (parallel analysis) and `plotters` (HTML report) are dropped. Re-add
# "plotters", "html_reports" here if the charts are ever wanted.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
egui-wgpu = "0.35"
image = "0.25"
skrifa = "0.45"
cssparser = "0.37"

# Workspace-wide lint posture. Each crate opts in via `[lints] workspace = true`.
# See `ai-docs/code-style.md` for the carve-out discipline behind the allows below.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# `priority = -1` keeps these group denies below the specific allows further down,
# so the targeted `= "allow"` entries win over the group.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
large_stack_frames = "deny"
large_stack_arrays = "deny"
undocumented_unsafe_blocks = "deny"
# Integer overflow- and signedness-safety audit (#48): every raw arithmetic op
# either converts to an explicit-semantics form (checked_*/saturating_*/...) or
# is deliberately retained under a documented, test-covered domain bound with a
# justified #[allow(clippy::arithmetic_side_effects, reason = "...")].
arithmetic_side_effects = "deny"
# `#[must_use]` is a deliberate, opt-in posture in this project — applied where it
# earns its keep, not blanket — so the candidate suggestion is noise here.
must_use_candidate = "allow"
# Explicit `pub(crate)` is kept even inside private modules: reading visibility
# locally is cheaper than re-deriving it from the module tree.
redundant_pub_crate = "allow"
# Same opt-in `#[must_use]` posture as `must_use_candidate`, for `-> Self` returns.
return_self_not_must_use = "allow"

# Dev/test build speed. `cargo test` builds under the `test` profile, which
# inherits from `dev` — the gp-gen generator sweeps are compute-bound, so an
# unoptimized build dominates their wall-clock.
#
# `debug-assertions` and `overflow-checks` keep their `dev` defaults (both
# `true`), so the integer-safety posture of #48 — debug_assert! coverage and
# release-overflow panics — is unaffected by the opt-level change.
[profile.dev]
opt-level = 1

# Dependencies are rebuilt rarely and never stepped through, so they can carry
# a higher opt-level than workspace code. The `"*"` glob excludes workspace
# packages, which stay at the `[profile.dev]` level above.
[profile.dev.package."*"]
opt-level = 2

# Benchmark codegen. Scoped to `[profile.bench]` rather than `[profile.release]`
# deliberately: benchmarking settings should not silently change what ships.
# `codegen-units = 1` lets LLVM see a whole crate at once (trading build time for
# code quality); thin LTO extends that across crate boundaries, which matters
# because the gp-core integer kernel is consumed from gp-gen / gp-game and would
# otherwise stop at the crate edge. `opt-level = 3` is inherited from `release`.
#
# Golden-image tests are unaffected either way — they build under `test`, which
# inherits `dev`.
[profile.bench]
lto = "thin"
codegen-units = 1
