# graphite-gp — grid racing game (see docs/design.md)
#
# Workspace layout mirrors the 4-block architecture (design doc §6):
#   crates/core    — block 3a: pure, deterministic physics core (shared dependency)
#   crates/gen     — block 1:  track generation
#   crates/render  — block 2:  rendering + UX
#   crates/ai      — block 4:  AI training
#   crates/game    — block 3b: game loop / orchestration (runnable binary)
#
# Build order (design doc §6): 3a -> (1 || 2) -> 4.

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/gen",
    "crates/render",
    "crates/ai",
    "crates/game",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Marat Bukharov <marat.buharov@gmail.com>"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gp-core = { path = "crates/core" }
gp-gen = { path = "crates/gen" }
gp-render = { path = "crates/render" }
gp-ai = { path = "crates/ai" }
thiserror = "2"
strum = { version = "0.28", features = ["derive"] }
enum-map = "2"
enumflags2 = "0.7"
rand = { version = "0.10", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.10", default-features = false }
egui = { version = "0.35", default-features = false }
resvg = { version = "0.47", default-features = false }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
eframe = { version = "0.35", default-features = false, features = ["accesskit", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = { version = "0.30", default-features = true }
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot"] }
egui-wgpu = "0.35"
image = "0.25"
skrifa = "0.44"

# Workspace-wide lint posture. Each crate opts in via `[lints] workspace = true`.
# See `ai-docs/code-style.md` for the carve-out discipline behind the allows below.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# `priority = -1` keeps these group denies below the specific allows further down,
# so the targeted `= "allow"` entries win over the group.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
large_stack_frames = "deny"
large_stack_arrays = "deny"
undocumented_unsafe_blocks = "deny"
# Integer overflow- and signedness-safety audit (#48): every raw arithmetic op
# either converts to an explicit-semantics form (checked_*/saturating_*/...) or
# is deliberately retained under a documented, test-covered domain bound with a
# justified #[allow(clippy::arithmetic_side_effects, reason = "...")].
arithmetic_side_effects = "deny"
# `#[must_use]` is a deliberate, opt-in posture in this project — applied where it
# earns its keep, not blanket — so the candidate suggestion is noise here.
must_use_candidate = "allow"
# Explicit `pub(crate)` is kept even inside private modules: reading visibility
# locally is cheaper than re-deriving it from the module tree.
redundant_pub_crate = "allow"
# Same opt-in `#[must_use]` posture as `must_use_candidate`, for `-> Self` returns.
return_self_not_must_use = "allow"
